<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Guided Hands</title>
    <style>
        body {
            margin: 0;
            padding: 14px;
            width: 270px;
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            font-size: 13px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #64748b;
            display: inline-block;
        }
        .dot.on {
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }
        .status {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #cbd5e1;
            word-break: break-word;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 12.5px;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #38bdf8;
            background: #0ea5e9;
            color: #082f49;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        button.secondary {
            background: #1e293b;
            color: #e2e8f0;
            border-color: #475569;
        }
    </style>
</head>
<body>
    <h1><span id="dot" class="dot"></span> Guided Hands</h1>
    <div id="status" class="status">Checking bridge...</div>
    <label>
        <input id="focusPref" type="checkbox" checked />
        Focus tab automatically on run
    </label>
    <div class="actions">
        <button id="reconnectBtn" type="button">Reconnect</button>
        <button id="focusBtn" type="button" class="secondary">Show Tab</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
